name: Deploy Friday Felt to Pages

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Test tournament domain
        run: pnpm test

      - name: Type-check application
        run: pnpm typecheck

      - name: Build tournament application
        run: pnpm build:app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 0
          working-directory: "${{ github.workspace }}/docs"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build public website
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: docs
        env:
          JEKYLL_ENV: production

      - name: Add tournament application to site
        run: |
          mkdir -p docs/_site/app
          cp -R apps/tournament/dist/. docs/_site/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
